# SPDX-License-Identifier: AGPL-3.0-or-later
# Required checks (job names) must match .github/rulesets/main.json.
name: ci

# Commit message (PR title) and DCO checks live in pr-checks.yml, which also
# runs when a PR title is edited without re-running these heavier jobs.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Bank connector crates again, with the disallowed_* lints forbidden so
      # no in-crate #[allow] can lower them.
      - run: cargo xtask clippy-connectors

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The storage, services and API tests also run on PostgreSQL when
    # SOLDE_TEST_DATABASE_URL is set (each test uses its own schema). Under
    # CI (GitHub sets CI=true) they fail instead of skipping without it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: solde_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d solde_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SOLDE_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/solde_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked
      - run: cargo test --workspace --doc --locked

  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny
      - run: cargo deny --locked check

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  vet:
    name: vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-vet
      - run: cargo vet --locked

  check-deps:
    name: check-deps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo xtask check-deps
      - run: cargo xtask fixtures-scrub-check
      # Postgres and SQLite migrations define the same tables, columns and indexes.
      - run: cargo xtask schema-parity
      # The committed OpenAPI document matches the API handlers.
      - run: cargo xtask openapi --check

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web build

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: solde:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test /healthz
        run: |
          # The server refuses to start without a master key and a database.
          mkdir -p "$RUNNER_TEMP/keys"
          head -c 32 /dev/urandom | base64 > "$RUNNER_TEMP/keys/master.key"
          chmod 0444 "$RUNNER_TEMP/keys/master.key"
          docker run -d --name solde -p 8080:8080 \
            -v "$RUNNER_TEMP/keys:/run/solde-keys:ro" \
            -e SOLDE_MASTER_KEY_FILE=/run/solde-keys/master.key \
            -e SOLDE_DATABASE_URL=sqlite:///data/solde.db \
            solde:ci
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz && curl -fsS http://127.0.0.1:8080/api/v1/meta; then
              docker rm -f solde; exit 0
            fi
            sleep 1
          done
          docker logs solde
          exit 1

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_VERSION: "8.30.1"
