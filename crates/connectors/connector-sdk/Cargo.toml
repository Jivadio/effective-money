[package]
name = "solde-connector-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# Shared test harness for connector crates (enable it in `[dev-dependencies]`).
testkit = ["dep:tracing-subscriber", "tokio/rt"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
regex.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
webpki-roots.workspace = true
zeroize.workspace = true

[dev-dependencies]
axum.workspace = true
# The SDK's own integration tests use its testkit.
solde-connector-sdk = { path = ".", features = ["testkit"] }
tokio = { workspace = true, features = ["time"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
