[workspace]
resolver = "3"
members = [
    "crates/core-domain",
    "crates/storage",
    "crates/secrets",
    "crates/services",
    "crates/sync-facade",
    "crates/sync",
    "crates/api",
    "crates/mcp",
    "crates/categorization",
    "crates/analytics",
    "crates/pricing",
    "crates/connectors/connector-sdk",
    "crates/connectors/registry",
    "crates/connectors/fake-bank",
    "crates/connectors/enable-banking",
    "crates/connectors/trade-republic",
    "crates/connectors/banque-populaire",
    "crates/connectors/banque-postale",
    "apps/server",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Jivadio/solde"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
cargo_metadata = "0.23"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

# Panics must unwind so the panic hook runs and a failing request/job does not
# abort the whole process.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
strip = "symbols"
