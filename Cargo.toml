[workspace]
resolver = "3"
members = [
    "crates/core-domain",
    "crates/storage",
    "crates/secrets",
    "crates/services",
    "crates/sync-facade",
    "crates/sync",
    "crates/api",
    "crates/mcp",
    "crates/categorization",
    "crates/analytics",
    "crates/pricing",
    "crates/connectors/connector-sdk",
    "crates/connectors/registry",
    "crates/connectors/fake-bank",
    "crates/connectors/enable-banking",
    "crates/connectors/trade-republic",
    "crates/connectors/banque-populaire",
    "crates/connectors/banque-postale",
    "apps/server",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Jivadio/solde"

[workspace.dependencies]
anyhow = "1"
# Password hashing (Argon2id) for the API; the salt comes from getrandom.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
async-trait = "0.1"
axum = "0.8"
# Master-key text form (the keygen container writes `base64` output).
base64 = "0.23"
cargo_metadata = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
# OS randomness for invitation, session and API tokens (already in the graph via uuid).
getrandom = "0.4"
http-body-util = "0.1"
# CIDR parsing for SOLDE_TRUSTED_PROXIES (already in the graph via reqwest).
ipnet = "2"
regex = "1"
# TLS through rustls with the ring provider only (no OpenSSL, no aws-lc).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
# PostgreSQL and SQLite (bundled) through one driver; TLS via rustls with the
# ring provider and webpki roots only (no OpenSSL, no aws-lc).
sqlx = { version = "0.9", default-features = false, features = ["chrono", "postgres", "runtime-tokio", "sqlite-bundled", "tls-rustls-ring-webpki", "uuid"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
# OpenAPI description of the REST API, generated from the handlers.
utoipa = "6"
uuid = { version = "1", default-features = false, features = ["std", "v7"] }
webpki-roots = "1"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

# Panics must unwind so the panic hook runs and a failing request/job does not
# abort the whole process.
[profile.dev]
panic = "unwind"

# Argon2 is slow by design; unoptimized, every test login would take
# seconds. Optimize just the hashing crates in dev and test builds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
strip = "symbols"
