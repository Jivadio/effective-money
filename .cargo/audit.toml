# cargo-audit configuration. Keep in sync with the ignore list in deny.toml,
# which explains each entry.
[advisories]
ignore = [
    # Bundled SQLite < 3.54. sqlx-sqlite 0.9.0 requires libsqlite3-sys
    # >=0.30.1, <0.38.0 (the lockfile has 0.37.0); the fix ships in 0.39.
    # Local-only, needs an attacker-written database + WAL pair.
    # Remove once an sqlx release allows libsqlite3-sys >= 0.39.
    "RUSTSEC-2026-0459",
]
