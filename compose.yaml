# effective-money: server + PostgreSQL. Usage: `docker compose up`.
# Skeleton for now: the server only serves /healthz; the database is not used yet.

name: effective-money

services:
  # One-shot init container: on the first start it generates the master key
  # ONLY into the dedicated `em-keys` volume (never the data volume) and NEVER
  # prints it. If a key already exists it does nothing.
  #
  # To use your own key instead, put it in a directory as `master.key` (readable
  # by uid 65532, e.g. mode 0444) and set EM_KEYS_SOURCE=/path/to/that/dir.
  # Back the generated key up separately: without it the data cannot be decrypted.
  keygen:
    image: alpine:3.22
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ${EM_KEYS_SOURCE:-em-keys}:/keys
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -s /keys/master.key ]; then
          echo "keygen: master key already present, nothing to do"
          exit 0
        fi
        umask 077
        head -c 32 /dev/urandom | base64 > /keys/master.key.tmp
        chmod 0400 /keys/master.key.tmp
        chown 65532:65532 /keys/master.key.tmp
        mv /keys/master.key.tmp /keys/master.key
        echo "keygen: master key generated in the em-keys volume (not displayed)"

  server:
    build: .
    image: ghcr.io/jivadio/effective-money:${EM_VERSION:-latest}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    depends_on:
      keygen:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      EM_LISTEN_ADDR: 0.0.0.0:8080
      # The server refuses to start if this file cannot be opened. The key
      # itself is not used yet.
      EM_MASTER_KEY_FILE: /run/em-keys/master.key
      EM_DATABASE_URL: postgres://effective_money:${EM_POSTGRES_PASSWORD:-change-me}@postgres:5432/effective_money
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ${EM_KEYS_SOURCE:-em-keys}:/run/em-keys:ro
    ports:
      - "${EM_PORT:-8080}:8080"
    # No container healthcheck yet: the distroless image has no shell or curl.

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # The image's entrypoint needs root capabilities to drop to the postgres user.
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: effective_money
      POSTGRES_PASSWORD: ${EM_POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: effective_money
    volumes:
      - em-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U effective_money -d effective_money"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  em-keys:
  em-pgdata:
