# SPDX-License-Identifier: AGPL-3.0-or-later
# Solde: server + PostgreSQL. Usage: `docker compose up`.
# Then open http://localhost:8080. The server serves the web app, the REST API
# (/api/v1) and /healthz. Guide: docs/self-hosting.md.

name: solde

services:
  # One-shot init container: on the first start it generates the master key
  # ONLY into the dedicated `solde-keys` volume (never the data volume) and NEVER
  # prints it. If a key already exists it does nothing.
  #
  # To use your own key instead, put it in a directory as `master.key` (readable
  # by uid 65532, e.g. mode 0444) and set SOLDE_KEYS_SOURCE=/path/to/that/dir.
  # Back the generated key up separately from the data (`docker compose run
  # --rm server admin export-key` prints it): without it, saved bank
  # credentials cannot be decrypted.
  keygen:
    image: alpine:3.22
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ${SOLDE_KEYS_SOURCE:-solde-keys}:/keys
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -s /keys/master.key ]; then
          echo "keygen: master key already present, nothing to do"
          exit 0
        fi
        umask 077
        head -c 32 /dev/urandom | base64 > /keys/master.key.tmp
        chmod 0400 /keys/master.key.tmp
        chown 65532:65532 /keys/master.key.tmp
        mv /keys/master.key.tmp /keys/master.key
        echo "keygen: master key generated in the solde-keys volume (not displayed)"

  server:
    build: .
    image: ghcr.io/jivadio/solde:${SOLDE_VERSION:-latest}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    depends_on:
      keygen:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      SOLDE_LISTEN_ADDR: 0.0.0.0:8080
      # The server refuses to start without a readable key (32 bytes, base64).
      SOLDE_MASTER_KEY_FILE: /run/solde-keys/master.key
      SOLDE_DATABASE_URL: postgres://solde:${SOLDE_POSTGRES_PASSWORD:-change-me}@postgres:5432/solde
      # Session cookies are `Secure` (HTTPS only; most browsers also accept them on
      # http://localhost). On a plain-HTTP LAN set SOLDE_INSECURE_COOKIES=1:
      # the server then warns at startup. Never do this on the internet.
      SOLDE_INSECURE_COOKIES: ${SOLDE_INSECURE_COOKIES:-0}
      # Behind a reverse proxy, its address or CIDR range (comma-separated), so
      # the login rate limit sees real client IPs from X-Forwarded-For.
      SOLDE_TRUSTED_PROXIES: ${SOLDE_TRUSTED_PROXIES:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ${SOLDE_KEYS_SOURCE:-solde-keys}:/run/solde-keys:ro
    # Reachable from this machine only. To open it to your network, set
    # SOLDE_BIND_ADDRESS=0.0.0.0 (and read docs/self-hosting.md about TLS
    # and SOLDE_INSECURE_COOKIES first).
    ports:
      - "${SOLDE_BIND_ADDRESS:-127.0.0.1}:${SOLDE_PORT:-8080}:8080"
    # No container healthcheck yet: the distroless image has no shell or curl.

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # The image's entrypoint needs root capabilities to drop to the postgres user.
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: solde
      POSTGRES_PASSWORD: ${SOLDE_POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: solde
    volumes:
      - solde-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solde -d solde"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  solde-keys:
  solde-pgdata:
