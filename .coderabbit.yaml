# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: "Friendly and encouraging, never nitpicky. Explain the why in one sentence, offer suggestions rather than orders, and celebrate what is done well."
reviews:
  profile: chill
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["main"]
    # Release PRs are generated by release-please (version bumps + changelog
    # from already-reviewed commits): nothing to review there.
    ignore_title_keywords: ["chore(main): release"]
  path_filters:
    - "!**/pnpm-lock.yaml"
    - "!**/Cargo.lock"
    - "!**/package-lock.json"
    - "!**/yarn.lock"
    - "!**/dist/**"
    - "!**/target/**"
    - "!**/node_modules/**"
    - "!**/*.min.js"
    - "!**/openapi.json"
    - "!**/generated/**"
    - "!**/*.generated.*"
    - "!LICENSE"
  path_instructions:
    - path: "crates/secrets/**"
      instructions: |
        Sensitive code. Check that no secret can end up in logs, `Debug`, `Display` or `Serialize`; that sensitive values are wiped from memory (zeroize); that keys are not cloned needlessly; and that neither the API nor MCP can reach decryption (only `crates/sync` may depend on this crate).
    - path: "crates/connectors/**"
      instructions: |
        Check that no real credentials, IBANs or personal data appear in code or fixtures; that the crate depends only on `connector-sdk` and the dependencies listed in `allowed-deps.toml`; that all HTTP/WS access goes through the SDK clients; and that nothing sensitive is logged.
    - path: "crates/mcp/**"
      instructions: |
        Check that token scopes are enforced on every tool, that text coming from bank transactions is treated as untrusted (prompt injection), and that no credential or secret is exposed in responses.
    - path: "crates/sync*/**"
      instructions: |
        Check that no interactive 2FA/SCA request is possible in a non-interactive job (scheduled or MCP-triggered), and that returned errors do not reveal another household member's private accounts.
    - path: "apps/web/**"
      instructions: |
        Check accessibility (labels, keyboard use, contrast), that no token or secret is stored in localStorage/sessionStorage, and that TypeScript stays strict (no unjustified `any`). Check the UI follows DESIGN.md: only CSS token variables (no hard-coded colours, sizes or shadows), colour never the only carrier of meaning, no hard-coded user-facing strings (all copy is translated for English, French, Italian, German and Spanish), and amounts and dates formatted with Intl for the active locale.
  tools:
    gitleaks:
      enabled: true
    github-checks:
      enabled: true
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CONTRIBUTING.md"
chat:
  auto_reply: true
