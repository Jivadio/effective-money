# cargo-deny configuration (licences compatible with AGPL-3.0, bans).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Bundled SQLite < 3.54 can return stale page-cache bytes when it opens a
    # database together with a crafted `-wal` file of another page size.
    # sqlx-sqlite 0.9.0 (latest) requires libsqlite3-sys >=0.30.1, <0.38.0
    # (the lockfile has 0.37.0); the fix ships in libsqlite3-sys 0.39.
    # Solde only opens its own database in its own data directory: whoever
    # can plant that file pair can already read and write the data. Remove
    # this entry as soon as an sqlx release allows libsqlite3-sys >= 0.39.
    # Mirrored in .cargo/audit.toml for `cargo audit`.
    { id = "RUSTSEC-2026-0459", reason = "local-only, needs attacker-written db+wal pair; no sqlx release with the fix yet" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The allow-list anticipates future dependencies.
unused-allowed-license = "allow"
# Permissive and weak-copyleft licences compatible with AGPL-3.0-or-later.
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
# Workspace crates are `publish = false`; their licence is AGPL-3.0-or-later.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    # TLS must go through rustls; no system OpenSSL.
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
